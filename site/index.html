<style>
        .radar-sweep {
            background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 219, 231, 0.1) 360deg);
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .animate-pulse-slow {
            animation: pulse 2s infinite ease-in-out;

<script>
        // Simple atmospheric effect: flicker some UI elements slightly
        const glitchedElements = document.querySelectorAll('.animate-pulse');
        setInterval(() => {
            glitchedElements.forEach(el => {
                if(Math.random() > 0.95) {
                    el.style.opacity = 0.2;
                    setTimeout(() => el.style.opacity = 1, 50);
                }
            });
        }, 100);
    </script>
